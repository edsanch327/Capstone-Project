<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5f0" />
    <title>Forma — Hair, in its element</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #242420;
        --muted: #77766f;
        --paper: #f8f5f0;
        --white: #fffefa;
        --olive: #71735a;
        --line: #e7e2d9;
        --serif: "Playfair Display", Georgia, serif;
        --sans: "DM Sans", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      .announcement {
        padding: 9px 20px;
        text-align: center;
        color: #f8f5f0;
        background: var(--ink);
        font-size: 11px;
        letter-spacing: 0.09em;
      }
      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(248, 245, 240, 0.94);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(36, 36, 32, 0.08);
      }
      .nav-wrap {
        max-width: 1280px;
        min-height: 76px;
        padding: 0 5.5%;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 42px;
      }
      .brand {
        flex: 0 0 auto;
        font: 600 25px var(--serif);
        letter-spacing: 0.04em;
      }
      .nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: clamp(15px, 2.2vw, 32px);
        flex: 1;
      }
      .nav-links a {
        color: #55554f;
        font-size: 12px;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--olive);
      }
      .nav-cta,
      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: white;
        padding: 13px 20px;
        font-size: 11px;
        letter-spacing: 0.07em;
        transition: 0.2s ease;
        cursor: pointer;
      }
      .nav-cta:hover,
      .button:hover {
        background: var(--olive);
        border-color: var(--olive);
      }
      .menu-toggle {
        display: none;
        border: 0;
        background: transparent;
        font-size: 23px;
        cursor: pointer;
      }
      .hero {
        max-width: 1440px;
        margin: auto;
        padding: 42px 5.5% 78px;
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        gap: 6%;
        align-items: center;
      }
      .eyebrow {
        color: var(--olive);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        max-width: 540px;
        margin: 20px 0;
        font: 400 clamp(48px, 6vw, 82px)/1.04 var(--serif);
        letter-spacing: -0.045em;
      }
      .hero-copy {
        max-width: 410px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.9;
      }
      .hero-actions {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 30px;
      }
      .text-link {
        padding-bottom: 5px;
        border-bottom: 1px solid var(--olive);
        font-size: 11px;
      }
      .hero-note {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 46px;
        color: var(--muted);
        font-size: 11px;
      }
      .stars {
        color: #a27b4d;
        letter-spacing: 0.1em;
      }
      .hero-image {
        position: relative;
        min-height: 510px;
        height: min(58vw, 650px);
        background: #d8cfc1;
        overflow: hidden;
      }
      .hero-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .image-caption {
        position: absolute;
        right: 18px;
        bottom: 18px;
        padding: 11px 15px;
        background: rgba(255, 254, 250, 0.9);
        font: 13px var(--serif);
      }
      .intro-strip {
        padding: 24px 5.5%;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 35px 70px;
        color: #5f6056;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .section {
        padding: 100px 5.5%;
      }
      .section-inner {
        max-width: 1180px;
        margin: auto;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        margin-bottom: 38px;
      }
      h2 {
        margin: 12px 0 0;
        font: 400 clamp(36px, 4.4vw, 56px)/1.1 var(--serif);
        letter-spacing: -0.035em;
      }
      .section-heading p {
        max-width: 340px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }
      .services {
        background: var(--white);
      }
      .service-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line);
      }
      .service-card {
        padding: 27px 23px 25px 0;
        border-bottom: 1px solid var(--line);
      }
      .service-card:not(:nth-child(3n + 1)) {
        padding-left: 23px;
        border-left: 1px solid var(--line);
      }
      .service-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        color: var(--olive);
        font-size: 11px;
      }
      .service-card h3 {
        margin: 0 0 9px;
        font: 400 25px var(--serif);
      }
      .service-card p {
        min-height: 44px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .service-meta {
        color: #52524d;
        font-size: 11px;
      }
      .team {
        background: #eeece5;
      }
      .team-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .stylist-card img {
        display: block;
        width: 100%;
        height: 340px;
        object-fit: cover;
        background: #d5d0c6;
      }
      .stylist-info {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 15px;
      }
      .stylist-info h3 {
        margin: 0;
        font: 400 23px var(--serif);
      }
      .stylist-info span {
        color: var(--muted);
        font-size: 10px;
      }
      .stylist-card p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
      .quote {
        padding: 82px 8%;
        text-align: center;
        background: #dcd8cc;
      }
      .quote blockquote {
        max-width: 780px;
        margin: 17px auto 20px;
        font: 400 clamp(27px, 3.8vw, 44px)/1.3 var(--serif);
      }
      .quote cite {
        color: #67675e;
        font-size: 10px;
        font-style: normal;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .booking {
        color: var(--white);
        background: #292a25;
      }
      .booking .eyebrow {
        color: #c2c5a8;
      }
      .booking-grid {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: 10%;
        align-items: start;
      }
      .booking h2 {
        margin-bottom: 18px;
      }
      .booking-copy {
        max-width: 365px;
        color: #c2c1b9;
        font-size: 13px;
        line-height: 1.9;
      }
      .contact-line {
        margin-top: 28px;
        color: #e5e2d9;
        font-size: 12px;
        line-height: 2;
      }
      .booking-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      .field label {
        color: #d4d2c9;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 13px 12px;
        border: 1px solid #56574f;
        border-radius: 0;
        outline: none;
        color: white;
        background: #33342e;
        font-size: 12px;
      }
      .field input:focus,
      .field select:focus {
        border-color: #c2c5a8;
      }
      .field select option {
        color: var(--ink);
        background: white;
      }
      .booking-form .button {
        grid-column: 1 / -1;
        width: fit-content;
        margin-top: 4px;
        border-color: #e9e7dc;
        color: var(--ink);
        background: #e9e7dc;
      }
      .booking-form .button:hover {
        color: white;
        background: var(--olive);
        border-color: var(--olive);
      }
      .form-message {
        grid-column: 1 / -1;
        min-height: 20px;
        margin: 0;
        color: #dfe3c5;
        font-size: 12px;
      }
      footer {
        padding: 23px 5.5%;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        color: #bbb9b0;
        background: #22231f;
        font-size: 10px;
      }
      footer a {
        color: #e6e3d9;
      }
      @media (max-width: 850px) {
        .nav-wrap {
          gap: 22px;
          padding: 0 4%;
        }
        .nav-links {
          gap: 14px;
        }
        .nav-links a {
          font-size: 11px;
        }
        .nav-cta {
          padding: 11px 13px;
        }
        .hero {
          padding: 36px 5% 60px;
          gap: 4%;
        }
        .hero-image {
          min-height: 430px;
        }
        .section {
          padding: 78px 5%;
        }
        .stylist-card img {
          height: 270px;
        }
      }
      @media (max-width: 650px) {
        .announcement {
          font-size: 9px;
        }
        .nav-wrap {
          min-height: 66px;
          justify-content: space-between;
        }
        .menu-toggle {
          display: block;
          order: 3;
        }
        .nav-cta {
          margin-left: auto;
        }
        .nav-links {
          display: none;
          position: absolute;
          top: 66px;
          left: 0;
          right: 0;
          padding: 18px 5%;
          background: var(--paper);
          border-bottom: 1px solid var(--line);
          flex-direction: column;
          align-items: flex-start;
          gap: 17px;
        }
        .nav-links.open {
          display: flex;
        }
        .hero {
          grid-template-columns: 1fr;
          padding: 42px 6% 55px;
        }
        h1 {
          max-width: 430px;
          font-size: clamp(50px, 14vw, 72px);
        }
        .hero-note {
          margin-top: 30px;
        }
        .hero-image {
          min-height: 380px;
          height: 105vw;
          max-height: 530px;
        }
        .intro-strip {
          gap: 14px 25px;
          padding: 20px 5%;
          font-size: 9px;
        }
        .section {
          padding: 68px 6%;
        }
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
          margin-bottom: 28px;
        }
        .service-grid {
          grid-template-columns: 1fr 1fr;
        }
        .service-card {
          padding: 22px 14px 22px 0;
        }
        .service-card:not(:nth-child(3n + 1)) {
          padding-left: 0;
          border-left: 0;
        }
        .service-card:nth-child(even) {
          padding-left: 14px;
          border-left: 1px solid var(--line);
        }
        .service-card p {
          min-height: 62px;
        }
        .team-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .stylist-card img {
          height: min(105vw, 440px);
        }
        .booking-grid {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .booking-form {
          gap: 13px;
        }
        footer {
          flex-direction: column;
        }
      }
      @media (max-width: 380px) {
        .brand {
          font-size: 22px;
        }
        .nav-cta {
          padding: 10px;
          font-size: 9px;
        }
        .booking-form {
          grid-template-columns: 1fr;
        }
        .field.full,
        .booking-form .button,
        .form-message {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const services = [
        {
          name: "Signature Cut",
          detail:
            "A considered cut, shaped around your texture and the way you live.",
          time: "45–60 min",
          price: "from $65",
        },
        {
          name: "Colour Ritual",
          detail:
            "Dimensional, natural-looking colour with a personalized consultation.",
          time: "2–3 hr",
          price: "from $145",
        },
        {
          name: "Gloss & Tone",
          detail:
            "A luminous refresh to refine tone and bring your colour back to life.",
          time: "60–90 min",
          price: "from $85",
        },
        {
          name: "Blowout",
          detail:
            "Soft movement or polished volume, finished to feel like you.",
          time: "45 min",
          price: "from $50",
        },
        {
          name: "Balayage",
          detail:
            "Seamless, sunlit dimension, thoughtfully placed for your features.",
          time: "3 hr",
          price: "from $220",
        },
        {
          name: "Bridal Styling",
          detail:
            "A personal preview and a beautiful, lasting look for your day.",
          time: "by consultation",
          price: "from $180",
        },
      ];
      const stylists = [
        {
          name: "Mara Ellis",
          role: "Creative Director",
          specialty: "Precision cuts · lived-in colour",
          image:
            "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=900&q=85",
        },
        {
          name: "Jules Bennett",
          role: "Senior Stylist",
          specialty: "Balayage · soft blondes",
          image:
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85",
        },
        {
          name: "Nina Park",
          role: "Stylist",
          specialty: "Texture · effortless styling",
          image:
            "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=900&q=85",
        },
      ];
      const links = [
        ["Home", "#home"],
        ["Services", "#services"],
        ["Stylists", "#stylists"],
        ["Our story", "#story"],
        ["Reviews", "#reviews"],
        ["Contact", "#contact"],
      ];
      function App() {
        const [menuOpen, setMenuOpen] = React.useState(false);
        const [message, setMessage] = React.useState("");
        const closeMenu = () => setMenuOpen(false);
        function submitBooking(event) {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          setMessage(
            `Thanks, ${data.get("name")} — your request for ${data.get("service")} has been noted. We'll be in touch to confirm a time.`,
          );
          event.currentTarget.reset();
        }
        return (
          <>
            <div className="announcement">
              A LITTLE SPACE TO FEEL LIKE YOURSELF — NOW BOOKING
            </div>
            <header className="header">
              <nav className="nav-wrap" aria-label="Main navigation">
                <a className="brand" href="#home" onClick={closeMenu}>
                  forma<span style={{ color: "var(--olive)" }}>.</span>
                </a>
                <div className={`nav-links ${menuOpen ? "open" : ""}`}>
                  {links.map(([label, href]) => (
                    <a key={label} href={href} onClick={closeMenu}>
                      {label}
                    </a>
                  ))}
                </div>
                <a className="nav-cta" href="#contact">
                  BOOK A VISIT&nbsp; ↗
                </a>
                <button
                  className="menu-toggle"
                  type="button"
                  aria-label="Toggle navigation"
                  aria-expanded={menuOpen}
                  onClick={() => setMenuOpen(!menuOpen)}
                >
                  {menuOpen ? "×" : "☰"}
                </button>
              </nav>
            </header>
            <main>
              <section className="hero" id="home">
                <div>
                  <div className="eyebrow">
                    Your hair, thoughtfully considered
                  </div>
                  <h1>
                    Good hair.
                    <br />
                    Good energy.
                  </h1>
                  <p className="hero-copy">
                    A neighbourhood studio for great hair and a slower kind of
                    self-care. Come as you are; leave feeling a little more like
                    yourself.
                  </p>
                  <div className="hero-actions">
                    <a className="button" href="#contact">
                      FIND YOUR APPOINTMENT&nbsp; ↗
                    </a>
                    <a className="text-link" href="#services">
                      Explore services
                    </a>
                  </div>
                  <div className="hero-note">
                    <span className="stars">★★★★★</span>
                    <span>4.9 / 5 from our lovely clients</span>
                  </div>
                </div>
                <div className="hero-image">
                  <img
                    src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1400&q=90"
                    alt="Stylist working on a client's hair in a bright salon"
                  />
                  <div className="image-caption">
                    A softer kind of salon day.
                  </div>
                </div>
              </section>
              <div className="intro-strip">
                <span>Thoughtful consultations</span>
                <span>Good people, good products</span>
                <span>Care that feels like you</span>
              </div>
              <section className="section services" id="services">
                <div className="section-inner">
                  <div className="section-heading">
                    <div>
                      <div className="eyebrow">The good stuff</div>
                      <h2>Made for your kind of hair.</h2>
                    </div>
                    <p>
                      Every appointment starts with a conversation. We'll find
                      the service that feels right for you.
                    </p>
                  </div>
                  <div className="service-grid">
                    {services.map((service, index) => (
                      <article className="service-card" key={service.name}>
                        <div className="service-top">
                          <span>0{index + 1}</span>
                          <span>↗</span>
                        </div>
                        <h3>{service.name}</h3>
                        <p>{service.detail}</p>
                        <div className="service-meta">
                          {service.time}&nbsp;&nbsp; · &nbsp;&nbsp;
                          {service.price}
                        </div>
                      </article>
                    ))}
                  </div>
                </div>
              </section>
              <section className="section team" id="stylists">
                <div className="section-inner">
                  <div className="section-heading">
                    <div>
                      <div className="eyebrow">The people behind the chair</div>
                      <h2>Good hands. Good humans.</h2>
                    </div>
                    <p>
                      Meet the artists who make Forma feel like your place. Find
                      your person, then come say hello.
                    </p>
                  </div>
                  <div className="team-grid">
                    {stylists.map((stylist) => (
                      <article className="stylist-card" key={stylist.name}>
                        <img
                          src={stylist.image}
                          alt={stylist.name}
                          loading="lazy"
                        />
                        <div className="stylist-info">
                          <h3>{stylist.name}</h3>
                          <span>{stylist.role}</span>
                        </div>
                        <p>{stylist.specialty}</p>
                      </article>
                    ))}
                  </div>
                </div>
              </section>
              <section className="quote" id="reviews">
                <div className="eyebrow">A note from the chair</div>
                <blockquote>
                  “I walked in needing a haircut and left feeling like the best
                  version of myself.”
                </blockquote>
                <cite>— Alex R., Forma client</cite>
              </section>
              <section className="section booking" id="contact">
                <div className="section-inner booking-grid">
                  <div>
                    <div className="eyebrow">Your chair is waiting</div>
                    <h2>Let's make time for you.</h2>
                    <p className="booking-copy">
                      Tell us what you're looking for and we'll get back to you
                      to find a time that works. We can't wait to meet you.
                    </p>
                    <div className="contact-line">
                      Monday–Saturday · By appointment
                      <br />
                      hello@formastudio.example
                      <br />
                      (555) 014-2026
                    </div>
                  </div>
                  <form className="booking-form" onSubmit={submitBooking}>
                    <div className="field">
                      <label htmlFor="name">Your name</label>
                      <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="First and last name"
                        required
                      />
                    </div>
                    <div className="field">
                      <label htmlFor="email">Email address</label>
                      <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                      />
                    </div>
                    <div className="field">
                      <label htmlFor="service">I'm interested in</label>
                      <select
                        id="service"
                        name="service"
                        required
                        defaultValue=""
                      >
                        <option value="" disabled>
                          Choose a service
                        </option>
                        {services.map((s) => (
                          <option key={s.name} value={s.name}>
                            {s.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div className="field">
                      <label htmlFor="date">Preferred date</label>
                      <input id="date" name="date" type="date" />
                    </div>
                    <button className="button" type="submit">
                      REQUEST AN APPOINTMENT&nbsp; ↗
                    </button>
                    <p
                      className="form-message"
                      role="status"
                      aria-live="polite"
                    >
                      {message}
                    </p>
